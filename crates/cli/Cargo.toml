[package]
name = "antegen-cli"
version = "8.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for Antegen - Solana automation and scheduling"
# Depends on a patched fork of service-manager. `[patch]` does not survive
# publishing, so a published build resolves upstream service-manager instead and
# fails to compile — the fork's RestartPolicy differs. Binaries are the
# distribution path for the CLI; see the release workflow.
publish = false
repository.workspace = true
homepage.workspace = true
keywords = ["solana", "automation", "scheduler", "blockchain"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "antegen"
path = "src/main.rs"

[dependencies]
antegen-client = { workspace = true }
antegen-thread-program = { workspace = true }
antegen-fiber-program = { workspace = true }
anchor-lang = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
dirs = { workspace = true }
solana-sdk = { workspace = true }
futures = { workspace = true }

loa-core = { workspace = true }
solana-cli-config = { workspace = true }
solana-system-interface = { workspace = true }
reqwest = { workspace = true }
shellexpand = { workspace = true }
tempfile = { workspace = true }
service-manager = "0.11"
self_update = { version = "0.42", default-features = false, features = [
  "rustls",
] }

[target.'cfg(unix)'.dependencies]
file-owner = "0.1"
libc = "0.2"

[features]
dev = []
prod = [] # Production mode - no dev build detection

[lints]
workspace = true
