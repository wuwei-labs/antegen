[package]
name = "antegen-thread-program"
description = "Solana program for Antegen - automation and scheduling threads"
version = "6.0.0"
authors = ["Antegen Maintainers <maintainers@antegen.xyz>"]
repository = "https://github.com/wuwei-labs/antegen"
homepage = "https://antegen.xyz/"
license.workspace = true
edition = "2021"
readme = "../../README.md"
keywords = ["solana", "automation", "scheduler", "blockchain", "anchor"]

[lib]
name = "antegen_thread_program"
crate-type = ["cdylib", "lib"]

[features]
default = []
anchor-debug = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "antegen-fiber-program/idl-build"]
no-entrypoint = []
no-log-ix-name = []
no-idl = []
custom-heap = []
custom-panic = []

[dependencies]
antegen-cron = { workspace = true }
antegen-fiber-program = { workspace = true }
solana-nonce = { workspace = true }
# For `sol_remaining_compute_units`, which reimbursement is measured from.
# Anchor's `solana_program` shim re-exports granular crates and does not carry
# the compute-meter syscall, so the umbrella is pulled in directly. Pinned to
# what the workspace already resolves, so its granular re-exports unify with
# Anchor's rather than introducing a second copy of `Pubkey` and friends.
solana-program = { workspace = true }
anchor-lang = { workspace = true, features = ["init-if-needed"] }
chrono = { workspace = true }
solana-security-txt = { workspace = true }

[dev-dependencies]
litesvm = { git = "https://github.com/wuwei-labs/litesvm.git", branch = "fix/durable-nonce-slot-warp" }
litesvm-token = { git = "https://github.com/wuwei-labs/litesvm.git", branch = "fix/durable-nonce-slot-warp" }
solana-sdk = { workspace = true }
solana-system-interface = { workspace = true }
anchor-lang = { workspace = true }
borsh = { workspace = true }

[lints]
workspace = true
