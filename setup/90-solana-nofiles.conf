# Session limits for the `sol` user (PAM limits.d drop-in).
# Install to: /etc/security/limits.d/90-solana-nofiles.conf
# Covers interactive sol sessions and any non-systemd launch of the validator.
# The systemd unit (antegen-crank.service) sets its own LimitNOFILE/LimitMEMLOCK
# for the service itself; this file covers everything else.
#
# nofile  = max open file descriptors
# memlock = max locked-in-memory address space (KB) -- ~1.9 GiB, matches the
#           service's LimitMEMLOCK=2000000000 bytes.
* - nofile 2000000
* - memlock 2000000
