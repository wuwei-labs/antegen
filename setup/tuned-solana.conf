[main]
summary=Solana validator tuning
include=throughput-performance

[cpu]
# PoH startup gate needs full clocks at benchmark time; persists across reboots
# (unit ExecStartPre also pins performance as belt-and-suspenders — DEPLOY-v4 §9).
governor=performance
energy_perf_bias=performance
force_latency=1

[sysctl]
# --- large UDP buffers for agave turbine/repair ---
net.core.rmem_max=134217728
net.core.rmem_default=134217728
net.core.wmem_max=134217728
net.core.wmem_default=134217728

# --- BBR congestion control (ported from 21-agave-validator.conf) ---
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# --- connection backlogs (ported) ---
net.core.somaxconn=65535
net.core.netdev_max_backlog=300000
net.ipv4.tcp_max_syn_backlog=65535

# --- file descriptors (ported; limits.d covers per-process nofile/memlock) ---
fs.nr_open=2000000

# --- memory / NUMA (ported) ---
vm.max_map_count=2000000
vm.swappiness=1
kernel.numa_balancing=0
